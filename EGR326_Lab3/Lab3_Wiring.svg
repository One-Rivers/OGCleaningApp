  <line x1="440" y1="460" x2="440" y2="520" stroke="#8c8c8c" stroke-width="3"/><rect x="433.0" y="477.0" width="14" height="26" rx="6" fill="#e3c89a" stroke="#b39a6b"/><rect x="433.0" y="480.0" width="14" height="3" fill="#7a4a1a"/><rect x="433.0" y="485.0" width="14" height="3" fill="#111"/><rect x="433.0" y="490.0" width="14" height="3" fill="#f57c00"/><rect x="433.0" y="495.0" width="14" height="3" fill="#c9a227"/><circle cx="440" cy="460" r="3" fill="#555"/><circle cx="440" cy="520" r="3" fill="#555"/>
  <line x1="600" y1="460" x2="600" y2="520" stroke="#8c8c8c" stroke-width="3"/><rect x="593.0" y="477.0" width="14" height="26" rx="6" fill="#e3c89a" stroke="#b39a6b"/><rect x="593.0" y="480.0" width="14" height="3" fill="#7a4a1a"/><rect x="593.0" y="485.0" width="14" height="3" fill="#111"/><rect x="593.0" y="490.0" width="14" height="3" fill="#f57c00"/><rect x="593.0" y="495.0" width="14" height="3" fill="#c9a227"/><circle cx="600" cy="460" r="3" fill="#555"/><circle cx="600" cy="520" r="3" fill="#555"/>
