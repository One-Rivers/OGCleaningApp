  <g fill="#555">
    <circle cx="100" cy="660" r="3"/><circle cx="120" cy="680" r="3"/><circle cx="160" cy="460" r="3"/><circle cx="460" cy="500" r="3"/><circle cx="460" cy="460" r="3"/>
    <circle cx="620" cy="500" r="3"/><circle cx="620" cy="460" r="3"/><circle cx="800" cy="620" r="3"/><circle cx="800" cy="660" r="3"/><circle cx="860" cy="600" r="3"/><circle cx="860" cy="680" r="3"/>
    <circle cx="440" cy="600" r="3"/><circle cx="480" cy="500" r="3"/><circle cx="820" cy="540" r="3"/><circle cx="840" cy="600" r="3"/><circle cx="640" cy="600" r="3"/><circle cx="600" cy="580" r="3"/>
    <circle cx="800" cy="500" r="3"/><circle cx="820" cy="500" r="3"/><circle cx="840" cy="500" r="3"/><circle cx="860" cy="500" r="3"/>
