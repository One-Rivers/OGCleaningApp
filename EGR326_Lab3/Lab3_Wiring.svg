    <polyline points="800,620 800,660" stroke="#d32f2f"/>
    <polyline points="860,600 860,680" stroke="#222"/>
    <polyline points="370,285 370,330 400,330 400,600 440,600" stroke="#f2c200"/>
    <polyline points="480,500 480,432 780,432 780,540 820,540" stroke="#f2c200"/>
    <polyline points="840,600 640,600" stroke="#2e9e3e"/>
    <polyline points="600,580 560,580 560,20 290,20 290,62" stroke="#2e9e3e"/>
    <polyline points="270,62 270,10 600,10 600,230" stroke="#1e6fd9"/>
  </g>

