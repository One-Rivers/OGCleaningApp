<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="hole" x="-10" y="-10" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="6" height="6" rx="1" fill="#9a9a9a"/>
    </pattern>
    <g id="res">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#8c8c8c" stroke-width="3"/>
      <rect x="22" y="-8" width="36" height="16" rx="7" fill="#e3c89a" stroke="#b39a6b"/>
    </g>
  </defs>
  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="20" y="740" font-size="14" fill="#555">EGR326 Lab 3 — HC-SR04 + 2N7000 level shifter + external LED on NUCLEO-F446RE</text>

  <!-- NUCLEO -->
  <rect x="80" y="40" width="440" height="260" rx="10" fill="#f4f4f4" stroke="#bbb" stroke-width="2"/>
  <rect x="100" y="120" width="50" height="40" fill="#c0c0c0" stroke="#888"/>
  <text x="104" y="176" font-size="10" fill="#666">USB</text>
  <text x="96" y="196" font-size="10" fill="#1d3f7a">printf → USART2 (PA2)</text>
  <text x="96" y="210" font-size="10" fill="#1d3f7a">→ USB COM port, 9600 8N1</text>
  <text x="96" y="223" font-size="9" fill="#666">(no wires, it rides the USB cable)</text>
  <circle cx="180" cy="110" r="9" fill="#2a6fd6" stroke="#1a4a90"/>
  <rect x="260" y="130" width="80" height="80" fill="#222"/>
  <text x="268" y="175" font-size="10" fill="#ddd">STM32F446</text>
  <text x="360" y="200" font-size="18" font-weight="bold" fill="#1d3f7a">NUCLEO</text>
  <text x="360" y="220" font-size="13" fill="#1d3f7a">F446RE</text>
  <rect x="214" y="80" width="12" height="7" fill="#38c048"/>
  <text x="230" y="87" font-size="9" fill="#555">LD2</text>
  <rect x="180" y="50" width="320" height="20" fill="#1e1e1e"/>
  <rect x="180" y="270" width="320" height="20" fill="#1e1e1e"/>
  <g fill="#d4b24a">
    <rect x="187" y="57" width="6" height="6"/><rect x="207" y="57" width="6" height="6"/><rect x="227" y="57" width="6" height="6"/><rect x="247" y="57" width="6" height="6"/><rect x="267" y="57" width="6" height="6"/><rect x="287" y="57" width="6" height="6"/><rect x="307" y="57" width="6" height="6"/><rect x="327" y="57" width="6" height="6"/><rect x="347" y="57" width="6" height="6"/><rect x="367" y="57" width="6" height="6"/><rect x="387" y="57" width="6" height="6"/><rect x="407" y="57" width="6" height="6"/><rect x="427" y="57" width="6" height="6"/><rect x="447" y="57" width="6" height="6"/><rect x="467" y="57" width="6" height="6"/><rect x="487" y="57" width="6" height="6"/>
    <rect x="187" y="277" width="6" height="6"/><rect x="207" y="277" width="6" height="6"/><rect x="227" y="277" width="6" height="6"/><rect x="247" y="277" width="6" height="6"/><rect x="267" y="277" width="6" height="6"/><rect x="287" y="277" width="6" height="6"/><rect x="307" y="277" width="6" height="6"/><rect x="327" y="277" width="6" height="6"/><rect x="347" y="277" width="6" height="6"/><rect x="367" y="277" width="6" height="6"/><rect x="387" y="277" width="6" height="6"/><rect x="407" y="277" width="6" height="6"/><rect x="427" y="277" width="6" height="6"/><rect x="447" y="277" width="6" height="6"/><rect x="467" y="277" width="6" height="6"/><rect x="487" y="277" width="6" height="6"/>
  </g>
  <g font-size="10" fill="#333" text-anchor="middle">
    <text x="270" y="84" transform="rotate(-90 270 84)" dy="3" text-anchor="end">D13 PA5</text>
    <text x="290" y="84" transform="rotate(-90 290 84)" dy="3" text-anchor="end">D12 PA6</text>
    <text x="210" y="262">5V</text>
    <text x="230" y="250">GND</text>
    <text x="370" y="262">A1 PA1</text>
    <text x="190" y="250">3V3</text>
  </g>

  <!-- LEGEND -->
  <rect x="780" y="34" width="300" height="266" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="796" y="58" font-size="14" font-weight="bold" fill="#222">Connections</text>
  <g font-size="12" fill="#333">
    <rect x="796" y="72" width="22" height="6" fill="#d32f2f"/><text x="828" y="79">5V rail → VCC, Q1 drain pull-up</text>
    <rect x="796" y="94" width="22" height="6" fill="#f57c00"/><text x="828" y="101">3V3 rail → Q2 drain pull-up</text>
    <rect x="796" y="116" width="22" height="6" fill="#222"/><text x="828" y="123">GND → sensor, Q1 S, Q2 S, LED −</text>
    <rect x="796" y="138" width="22" height="6" fill="#f2c200"/><text x="828" y="145">PA1 (A1) → TRIG, straight</text>
    <rect x="796" y="160" width="22" height="6" fill="#2e9e3e"/><text x="828" y="167">ECHO → 1kΩ → Q1 → Q2 → PA6</text>
    <rect x="796" y="182" width="22" height="6" fill="#1e6fd9"/><text x="828" y="189">PA5 (D13) → 330Ω → LED → GND</text>
    <text x="796" y="214" fill="#666" font-size="11">Q1 flips ECHO, Q2 flips it back,</text>
    <text x="796" y="229" fill="#666" font-size="11">so PA6 = ECHO at 3.3V (not inverted)</text>
    <text x="796" y="248" fill="#666" font-size="11">2N7000s flat side facing AWAY: D G S</text>
    <text x="796" y="264" fill="#666" font-size="11">10kΩ ×2, 1kΩ gate, 330Ω LED</text>
    <text x="796" y="283" fill="#666" font-size="11">Shifter_Inverts = 0 in Lab3_Functions.h</text>
  </g>

  <!-- BREADBOARD -->
  <rect x="80" y="420" width="960" height="290" rx="6" fill="#ececec" stroke="#cfcfcf"/>
  <rect x="90" y="450" width="600" height="20" fill="url(#hole)"/>
  <line x1="90" y1="474" x2="690" y2="474" stroke="#f57c00" stroke-width="2"/>
  <text x="250" y="487" font-size="11" fill="#f57c00">3V3 rail</text>
  <rect x="90" y="490" width="940" height="140" fill="url(#hole)"/>
  <line x1="90" y1="645" x2="1030" y2="645" stroke="#d32f2f" stroke-width="2"/>
  <rect x="90" y="650" width="940" height="20" fill="url(#hole)"/>
  <rect x="90" y="670" width="940" height="20" fill="url(#hole)"/>
  <line x1="90" y1="697" x2="1030" y2="697" stroke="#1e6fd9" stroke-width="2"/>
  <text x="1033" y="664" font-size="11" fill="#d32f2f">5V</text>
  <text x="1034" y="686" font-size="14" fill="#1e6fd9">−</text>

  <!-- HC-SR04 -->
  <rect x="720" y="310" width="220" height="100" rx="6" fill="#1d4f9c" stroke="#123a75" stroke-width="2"/>
  <circle cx="770" cy="355" r="34" fill="#c9c9c9" stroke="#888" stroke-width="3"/><circle cx="770" cy="355" r="20" fill="#555"/>
  <circle cx="890" cy="355" r="34" fill="#c9c9c9" stroke="#888" stroke-width="3"/><circle cx="890" cy="355" r="20" fill="#555"/>
  <text x="830" y="330" font-size="11" fill="#fff" text-anchor="middle">HC-SR04</text>
  <g font-size="9" fill="#fff" text-anchor="start"><text transform="translate(803,406) rotate(-90)">VCC</text><text transform="translate(823,406) rotate(-90)">TRIG</text><text transform="translate(843,406) rotate(-90)">ECHO</text><text transform="translate(863,406) rotate(-90)">GND</text></g>
  <g stroke="#9a9a9a" stroke-width="3"><line x1="800" y1="410" x2="800" y2="500"/><line x1="820" y1="410" x2="820" y2="500"/><line x1="840" y1="410" x2="840" y2="500"/><line x1="860" y1="410" x2="860" y2="500"/></g>

  <!-- MOSFETS -->
  <line x1="480" y1="552" x2="480" y2="560" stroke="#9a9a9a" stroke-width="3"/><circle cx="480" cy="560" r="3" fill="#555"/><line x1="500" y1="552" x2="500" y2="560" stroke="#9a9a9a" stroke-width="3"/><circle cx="500" cy="560" r="3" fill="#555"/><line x1="520" y1="552" x2="520" y2="560" stroke="#9a9a9a" stroke-width="3"/><circle cx="520" cy="560" r="3" fill="#555"/><path d="M470,552 L470,534 Q500,512 530,534 L530,552 Z" fill="#3a3a3a" stroke="#111"/><text x="500" y="547" font-size="9" fill="#fff" text-anchor="middle">Q2</text><g font-size="9" fill="#333" text-anchor="middle"><text x="480" y="580">D</text><text x="500" y="580">G</text><text x="520" y="580">S</text></g>
  <line x1="640" y1="552" x2="640" y2="560" stroke="#9a9a9a" stroke-width="3"/><circle cx="640" cy="560" r="3" fill="#555"/><line x1="660" y1="552" x2="660" y2="560" stroke="#9a9a9a" stroke-width="3"/><circle cx="660" cy="560" r="3" fill="#555"/><line x1="680" y1="552" x2="680" y2="560" stroke="#9a9a9a" stroke-width="3"/><circle cx="680" cy="560" r="3" fill="#555"/><path d="M630,552 L630,534 Q660,512 690,534 L690,552 Z" fill="#3a3a3a" stroke="#111"/><text x="660" y="547" font-size="9" fill="#fff" text-anchor="middle">Q1</text><g font-size="9" fill="#333" text-anchor="middle"><text x="640" y="580">D</text><text x="660" y="580">G</text><text x="680" y="580">S</text></g>

  <!-- OFF BOARD LED -->
  <use href="#res" x="280" y="540"/>
  <g transform="translate(302,540)"><rect x="4" y="-8" width="3" height="16" fill="#f57c00"/><rect x="10" y="-8" width="3" height="16" fill="#f57c00"/><rect x="16" y="-8" width="3" height="16" fill="#7a4a1a"/><rect x="28" y="-8" width="3" height="16" fill="#c9a227"/></g>
  <text x="320" y="528" font-size="11" fill="#333" text-anchor="middle">330Ω</text>
  <g stroke="#9a9a9a" stroke-width="3"><line x1="360" y1="566" x2="360" y2="580"/><line x1="380" y1="566" x2="380" y2="580"/></g>
  <path d="M354,570 L354,556 A16,16 0 0 1 386,556 L386,570 Z" fill="#e53935" stroke="#a52020" stroke-width="1.5"/>
  <line x1="386" y1="555" x2="386" y2="570" stroke="#7a1515" stroke-width="3"/>
  <circle cx="363" cy="551" r="4" fill="#ff9a9a"/>
  <g font-size="10" fill="#333" text-anchor="middle"><text x="352" y="597">+</text><text x="390" y="597">−</text></g>
  <text x="400" y="545" font-size="10" fill="#333">LED</text>

  <!-- GATE RESISTOR -->
  <use href="#res" x="760" y="580"/>
  <g transform="translate(782,580)"><rect x="4" y="-8" width="3" height="16" fill="#7a4a1a"/><rect x="10" y="-8" width="3" height="16" fill="#111"/><rect x="16" y="-8" width="3" height="16" fill="#d32f2f"/><rect x="28" y="-8" width="3" height="16" fill="#c9a227"/></g>

  <!-- WIRES -->
  <g fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="210,285 210,360 100,360 100,660" stroke="#d32f2f"/>
    <polyline points="230,285 230,380 120,380 120,680" stroke="#222"/>
    <polyline points="190,285 190,400 160,400 160,460" stroke="#f57c00"/>
    <polyline points="800,620 800,660" stroke="#d32f2f"/>
    <polyline points="860,600 860,680" stroke="#222"/>
    <polyline points="680,620 680,680" stroke="#222"/>
    <polyline points="520,600 520,680" stroke="#222"/>
    <polyline points="370,285 370,330 700,330 700,540 820,540" stroke="#f2c200"/>
    <polyline points="760,600 660,600" stroke="#2e9e3e"/>
    <polyline points="380,600 380,680" stroke="#222"/>
    <polyline points="640,500 640,480 500,480 500,500" stroke="#2e9e3e"/>
    <polyline points="480,600 460,600 460,432 540,432 540,20 290,20 290,62" stroke="#2e9e3e"/>
    <polyline points="270,62 270,10 60,10 60,520 280,520" stroke="#1e6fd9"/>
  </g>

  <!-- PULL-UPS -->
  <line x1="640" y1="620" x2="640" y2="660" stroke="#8c8c8c" stroke-width="3"/><rect x="633.0" y="627.0" width="14" height="26" rx="6" fill="#e3c89a" stroke="#b39a6b"/><rect x="633.0" y="630.0" width="14" height="3" fill="#7a4a1a"/><rect x="633.0" y="635.0" width="14" height="3" fill="#111"/><rect x="633.0" y="640.0" width="14" height="3" fill="#f57c00"/><rect x="633.0" y="645.0" width="14" height="3" fill="#c9a227"/><circle cx="640" cy="620" r="3" fill="#555"/><circle cx="640" cy="660" r="3" fill="#555"/>
  <line x1="480" y1="460" x2="480" y2="500" stroke="#8c8c8c" stroke-width="3"/><rect x="473.0" y="467.0" width="14" height="26" rx="6" fill="#e3c89a" stroke="#b39a6b"/><rect x="473.0" y="470.0" width="14" height="3" fill="#7a4a1a"/><rect x="473.0" y="475.0" width="14" height="3" fill="#111"/><rect x="473.0" y="480.0" width="14" height="3" fill="#f57c00"/><rect x="473.0" y="485.0" width="14" height="3" fill="#c9a227"/><circle cx="480" cy="460" r="3" fill="#555"/><circle cx="480" cy="500" r="3" fill="#555"/>
  <g font-size="10" fill="#333"><text x="648" y="639">10k</text><text x="492" y="453">10k</text></g>

  <!-- LABELS -->
  <g font-size="10" fill="#333">
    <text x="800" y="566" text-anchor="middle">1kΩ</text><text x="712" y="618" text-anchor="middle">1kΩ → Q1 G</text>
    <text x="592" y="452" text-anchor="middle">Q1 D → Q2 G</text>
    <text x="548" y="396">Q2 D → PA6</text>
    <text x="612" y="325">PA1 → TRIG</text>
  </g>

  <g fill="#555"><circle cx="100" cy="660" r="3"/><circle cx="120" cy="680" r="3"/><circle cx="160" cy="460" r="3"/><circle cx="800" cy="620" r="3"/><circle cx="800" cy="660" r="3"/><circle cx="860" cy="600" r="3"/><circle cx="860" cy="680" r="3"/><circle cx="680" cy="620" r="3"/><circle cx="680" cy="680" r="3"/><circle cx="520" cy="600" r="3"/><circle cx="520" cy="680" r="3"/><circle cx="820" cy="540" r="3"/><circle cx="840" cy="580" r="3"/><circle cx="760" cy="580" r="3"/><circle cx="760" cy="600" r="3"/><circle cx="280" cy="520" r="3"/><circle cx="280" cy="540" r="3"/><circle cx="360" cy="540" r="3"/><circle cx="360" cy="580" r="3"/><circle cx="380" cy="580" r="3"/><circle cx="380" cy="600" r="3"/><circle cx="380" cy="680" r="3"/><circle cx="660" cy="600" r="3"/><circle cx="640" cy="500" r="3"/><circle cx="500" cy="500" r="3"/><circle cx="480" cy="600" r="3"/><circle cx="800" cy="500" r="3"/><circle cx="820" cy="500" r="3"/><circle cx="840" cy="500" r="3"/><circle cx="860" cy="500" r="3"/></g>
</svg>
